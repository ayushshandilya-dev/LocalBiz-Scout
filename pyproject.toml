[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localbiz-scout"
version = "0.1.0"
description = "Scaffold for collecting and de-duplicating local business records."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LocalBiz Scout contributors" }]
dependencies = ["rapidfuzz>=3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
localbiz-scout = "localbiz_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
